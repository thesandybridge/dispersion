# XcodeGen spec — generates Dispersion.xcodeproj from this directory tree.
#
# Setup (one-time):
#   brew install xcodegen
#
# Generate / regenerate the Xcode project:
#   cd ios
#   xcodegen generate
#   open Dispersion.xcodeproj
#
# Re-run xcodegen any time you add or rename source files.

name: Dispersion
options:
  bundleIdPrefix: app.dispersion
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UILaunchStoryboardName: ""
    ASSETCATALOG_COMPILER_LAUNCHSCREEN_BACKGROUND_COLOR: LaunchBackground
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dispersion uses your location to find nearby courses and track shots on the course."
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
targets:
  Dispersion:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Dispersion
        excludes:
          - "**/*.md"
          - "Resources/AppIconSource/**"
    dependencies:
      - target: DispersionWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dispersion.Dispersion
        INFOPLIST_KEY_CFBundleDisplayName: Dispersion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Sand AppIcon-Sunset AppIcon-Slate
  DispersionWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: DispersionWatch
      - path: Shared
    dependencies:
      - target: DispersionWatchWidgets
        embed: true
    info:
      path: DispersionWatch/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: [dispersion]
        NSMotionUsageDescription: "Dispersion can suggest marking a shot after a possible golf swing."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dispersion.Dispersion.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: Dispersion
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: app.dispersion.Dispersion
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Dispersion uses your location for yardages and to mark your golf shots."
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DispersionWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: DispersionWatchWidgets
    info:
      path: DispersionWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dispersion.Dispersion.watchkitapp.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Dispersion
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
  DispersionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DispersionTests
    dependencies:
      - target: Dispersion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dispersion.DispersionTests
schemes:
  Dispersion:
    build:
      targets:
        Dispersion: all
        DispersionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DispersionTests
  DispersionWatch:
    build:
      targets:
        DispersionWatch: all
    run:
      config: Debug
