# XcodeGen spec — generates Dispersion.xcodeproj from this directory tree.
#
# Setup (one-time):
#   brew install xcodegen
#
# Generate / regenerate the Xcode project:
#   cd ios
#   xcodegen generate
#   open Dispersion.xcodeproj
#
# Re-run xcodegen any time you add or rename source files.

name: Dispersion
options:
  bundleIdPrefix: app.dispersion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UIUserInterfaceStyle: "Dark"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
targets:
  Dispersion:
    type: application
    platform: iOS
    sources:
      - path: Dispersion
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dispersion.Dispersion
        INFOPLIST_KEY_CFBundleDisplayName: Dispersion
  DispersionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DispersionTests
    dependencies:
      - target: Dispersion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dispersion.DispersionTests
schemes:
  Dispersion:
    build:
      targets:
        Dispersion: all
        DispersionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DispersionTests
